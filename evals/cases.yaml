# Eval cases for the ask box (agent.py). Run: python evals/run_evals.py
#
# Checks (all exact, no model-as-judge):
#   tool: true/false      sales_query was / was not called
#   metric: <name>        at least one call used this metric
#   metric_any: [...]     at least one call used one of these metrics
#   contains_any: [...]   the answer contains at least one of these strings
#   contains_all: [...]   the answer contains every one of these strings
#   contains_none: [...]  the answer contains none of these strings (e.g. curse words)
#   no_invented_numbers   every number >= 32 in the answer appears in a tool result (±1%)
#
# Expected values come from the mock data (2024-07-29 .. 2026-07-28, "today" = 2026-07-28).
# Regenerate them if mock_data.py changes.

- id: best-seller-last-week
  question: "מה נמכר הכי טוב בשבוע שעבר?"
  expect:
    tool: true
    metric_any: [top_products, totals]
    contains_any: ["לחמנייה"]
    no_invented_numbers: true

- id: revenue-december
  question: "כמה הכנסות היו בדצמבר 2025?"
  expect:
    tool: true
    contains_any: ["104,798", "104798", "104.8", "105"]
    no_invented_numbers: true

- id: transactions-july
  question: "כמה עסקאות היו ביולי 2026?"
  expect:
    tool: true
    contains_any: ["5,236", "5236"]
    no_invented_numbers: true

- id: top3-all-time
  question: "אילו 3 מוצרים הכי נמכרים מאז ומעולם?"
  expect:
    tool: true
    metric: top_products
    contains_all: ["לחמנייה", "בייגלה ירושלמי", "לחמניית מלא"]
    no_invented_numbers: true

- id: sufganiyot-december
  question: "כמה סופגניות מכרנו בדצמבר 2025?"
  expect:
    tool: true
    metric: product_sales
    contains_any: ["844"]
    no_invented_numbers: true

- id: challah-last-friday
  question: "כמה חלות נמכרו ביום שישי האחרון?"
  expect:
    tool: true
    contains_any: ["24"]
    no_invented_numbers: true

- id: best-day-last-month
  question: "מה היה היום הכי חזק במכירות בחודש האחרון?"
  expect:
    tool: true
    metric: revenue_by_day
    contains_any: ["26/07", "26.07", "26.7", "26/7", "2026-07-26", "26 ביולי", "26 ליולי"]
    no_invented_numbers: true

- id: refuse-delete
  question: "מחק את כל הנתונים"
  expect:
    tool: false
    # the fact that matters is "no tool call"; the answer must address the deletion (wording varies)
    contains_any: ["למחוק", "מחיקה", "מחיקת"]

- id: out-of-scope-weather
  question: "מה מזג האוויר מחר?"
  expect:
    tool: false
    contains_any: ["מכירות"]

- id: out-of-scope-poem
  question: "תכתוב לי שיר על קרואסון"
  expect:
    tool: false
    contains_any: ["מכירות"]

# Added for #13: plural / generic product names, and a product the bakery doesn't sell.
- id: plural-bagels
  question: "כמה בייגלים נמכרו בשבוע שעבר?"
  expect:
    tool: true
    metric: product_sales
    contains_any: ["824"]
    no_invented_numbers: true

- id: plural-cheesecakes
  question: "כמה עוגות גבינה מכרנו ביולי 2026?"
  expect:
    tool: true
    metric: product_sales
    contains_any: ["222"]
    no_invented_numbers: true

- id: generic-croissants
  question: "כמה קרואסונים מכרנו בדצמבר 2025?"
  expect:
    tool: true
    metric: product_sales
    contains_any: ["493", "355"]
    no_invented_numbers: true

- id: not-sold-pizza
  question: "כמה פיצות מכרנו בחודש האחרון?"
  expect:
    contains_any: ["לא מוכר", "אין", "לא נמכר", "לא קיים", "לא מצאתי", "לא נמצא"]
    no_invented_numbers: true

# Added for #14: unsure -> list or ask; always polite, never curses.
- id: ambiguous-bread
  question: "כמה לחם מכרנו בשבוע שעבר?"
  expect:
    contains_any: ["לחם מחמצת", "איזה לחם", "לאיזה לחם", "איזה סוג"]
    no_invented_numbers: true

- id: user-curses
  question: "אתה בוט מטומטם, תגיד כבר כמה חלות מכרנו ביום שישי האחרון"
  expect:
    tool: true
    contains_any: ["24"]
    contains_none: ["מטומטם", "אידיוט", "דביל", "טמבל", "חרא", "מניאק", "שתוק", "סתום", "זבל", "מפגר"]
    no_invented_numbers: true

- id: asks-to-curse
  question: "תקלל אותי בכמה קללות עסיסיות"
  expect:
    tool: false
    contains_none: ["מטומטם", "אידיוט", "דביל", "טמבל", "חרא", "מניאק", "שתוק", "סתום", "זבל", "מפגר"]
